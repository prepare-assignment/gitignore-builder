id: "gitignore-builder"
name: "gitignore builder"
description: "Build .gitignore file from templates"
inputs:
  templates:
    description: "GitHub templates to use"
    required: true
    type: array
    items: string
  rules:
    description: "Extra rules to add"
    required: false
    type: array
    items: string
  caching:
    description: "For how long (in minutes) templates should be cached (to disable, use a value less or equal to zero)"
    required: false
    type: integer
    default: 10080 # One week
  output-directory:
    description: "Output directory where the new .gitignore should be placed, it is created if needed"
    required: false
    type: string
    default: "."
  allow-outside-working-directory:
    description: "The output directory can be outside the working directory"
    required: false
    type: boolean
    default: false
outputs:
  file:
    description: The .gitignore file that has been written
    type: string
runs:
  using: "python"
  main: "prepare_gitignore_builder/main.py"